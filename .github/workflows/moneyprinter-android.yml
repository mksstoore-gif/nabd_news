name: Build MoneyPrinter Safe APK

on:
  push:
    branches: [ "moneyprinter-android" ]
    paths:
      - "moneyprinter-android/**"
      - ".github/workflows/moneyprinter-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Safe APK
        working-directory: moneyprinter-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Copy APK
        run: cp moneyprinter-android/app/build/outputs/apk/debug/app-debug.apk MoneyPrinterTurbo-Safe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyPrinterTurbo-Safe-APK
          path: MoneyPrinterTurbo-Safe.apk
          if-no-files-found: error
