name: Build SweepX Arabic APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "sweepx-android/**"
      - ".github/workflows/sweepx-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: sweepx-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: cp sweepx-android/app/build/outputs/apk/debug/app-debug.apk SweepX-Arabic.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SweepX-Arabic-APK
          path: SweepX-Arabic.apk
          if-no-files-found: error
