<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OpenVideo" />
  <link rel="manifest" href="./manifest.json" />
  <title>OpenVideo — نص إلى فيديو حقيقي</title>
  <style>
    :root{--bg:#070b16;--card:#10172a;--card2:#0c1324;--txt:#f8fafc;--muted:#94a3b8;--line:#23304a;--p:#7c5cff;--p2:#35d0ff;--ok:#22c55e;--bad:#ef4444}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#172043 0,#070b16 45%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
    .wrap{max-width:820px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(44px + env(safe-area-inset-bottom))}
    .brand{display:flex;align-items:center;gap:13px;margin-bottom:24px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:0 12px 35px #674cff55}.brand h1{margin:0;font-size:28px}.brand p{margin:3px 0 0;color:var(--muted);font-size:14px}
    .card{background:linear-gradient(180deg,#11192cdd,#0c1324ee);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 20px 60px #0006}
    label{display:block;font-weight:700;margin:5px 0 9px}.hint{color:var(--muted);font-size:13px;font-weight:400}
    textarea{width:100%;min-height:140px;resize:vertical;background:#060b18;color:#fff;border:1px solid #293752;border-radius:18px;padding:16px;font-size:18px;line-height:1.7;outline:none}textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #7c5cff22}
    .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 18px}.chip{border:1px solid #2c3955;background:#0a1020;color:#cbd5e1;border-radius:14px;padding:12px 8px;font-weight:700;cursor:pointer}.chip.active{background:#241d52;border-color:#7c5cff;color:#fff}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{background:#09101f;border:1px solid var(--line);border-radius:15px;padding:12px}.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.field select,.field input{width:100%;background:transparent;border:0;color:#fff;font-size:16px;outline:none}
    .go{width:100%;border:0;border-radius:18px;padding:16px 20px;margin-top:18px;background:linear-gradient(135deg,var(--p),#5d7cff);color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 14px 35px #6d5cff44}.go:disabled{opacity:.55;cursor:not-allowed}
    .status{margin-top:14px;display:none;align-items:center;gap:10px;background:#08111f;border:1px solid var(--line);border-radius:15px;padding:12px;color:#dbeafe}.status.show{display:flex}.spin{width:18px;height:18px;border:2px solid #ffffff33;border-top-color:#fff;border-radius:50%;animation:s .9s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
    .result{display:none;margin-top:18px}.result.show{display:block}.videoBox{border-radius:20px;overflow:hidden;background:#000;border:1px solid var(--line)}video{display:block;width:100%;max-height:70vh;background:#000}.actions{display:flex;gap:10px;margin-top:10px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:#0b1324;color:#fff;font-weight:800}
    .note{margin-top:16px;color:var(--muted);font-size:13px;line-height:1.7}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:7px}.err{color:#fecaca;border-color:#7f1d1d;background:#250b0b}
    .examples{margin-top:18px}.examples button{margin:5px 0 0 6px;background:#0a1020;color:#cbd5e1;border:1px solid var(--line);padding:9px 11px;border-radius:12px}
    @media(max-width:600px){.wrap{padding-left:12px;padding-right:12px}.brand h1{font-size:23px}.grid{grid-template-columns:1fr}.card{border-radius:19px;padding:14px}.chips{grid-template-columns:1fr 1fr 1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <div class="logo">▶</div>
      <div><h1>OpenVideo</h1><p>نص → مشهد فيديو حقيقي</p></div>
    </div>

    <section class="card">
      <label for="prompt">اكتب المشهد الذي تريده <span class="hint">مثال: طائرة ركاب تهبط اضطراريًا في الصحراء، تصوير واقعي سينمائي</span></label>
      <textarea id="prompt" placeholder="صف المشهد بالتفصيل..."></textarea>

      <div class="examples">
        <button type="button" data-p="طائرة ركاب تحلق في السماء ثم تهبط اضطراريًا في منطقة صحراوية، تصوير واقعي، كاميرا بعيدة، إضاءة نهارية، حركة طبيعية">✈️ طائرة</button>
        <button type="button" data-p="سيارة رياضية تسير بسرعة على طريق جبلي وقت الغروب، تصوير سينمائي واقعي، حركة كاميرا سلسة">🏎️ سيارة</button>
        <button type="button" data-p="أمواج بحر ضخمة تضرب منارة على الساحل أثناء عاصفة، واقعي جدًا، لقطة سينمائية درامية">🌊 عاصفة</button>
      </div>

      <div class="chips" id="aspect">
        <button class="chip active" data-a="9:16">عمودي 9:16</button>
        <button class="chip" data-a="16:9">أفقي 16:9</button>
        <button class="chip" data-a="1:1">مربع 1:1</button>
      </div>

      <div class="grid">
        <div class="field"><span>مدة الفيديو</span><select id="duration"><option value="2">2 ثانية</option><option value="3" selected>3 ثوانٍ</option><option value="4">4 ثوانٍ</option><option value="5">5 ثوانٍ</option><option value="6">6 ثوانٍ</option><option value="8">8 ثوانٍ</option></select></div>
        <div class="field"><span>البذرة</span><input id="seed" type="number" value="42" min="0" max="4294967295"></div>
      </div>

      <button class="go" id="generate">إنشاء فيديو حقيقي</button>
      <div class="status" id="status"><div class="spin"></div><div id="statusText">جاري الاتصال بالمحرك المفتوح...</div></div>

      <div class="result" id="result">
        <div class="videoBox"><video id="video" controls playsinline></video></div>
        <div class="actions">
          <a id="download" href="#" download="openvideo.mp4">حفظ الفيديو</a>
          <button id="again" type="button">توليد نسخة أخرى</button>
        </div>
      </div>

      <div class="note"><span class="dot"></span>المحرك: LTX Video Fast مفتوح المصدر عبر Hugging Face ZeroGPU. لا يوجد API Key داخل التطبيق ولا اشتراك مفروض من OpenVideo. وقت الزحام قد تدخل المهمة في طابور GPU العام.</div>
    </section>
  </main>

<script type="module">
import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/+esm";

const $ = s => document.querySelector(s);
const promptEl=$("#prompt"), gen=$("#generate"), status=$("#status"), statusText=$("#statusText"), result=$("#result"), video=$("#video"), dl=$("#download");
let aspect="9:16";
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");aspect=b.dataset.a;});
document.querySelectorAll(".examples button").forEach(b=>b.onclick=()=>promptEl.value=b.dataset.p);
$("#again").onclick=()=>{result.classList.remove("show");video.removeAttribute("src");video.load();window.scrollTo({top:0,behavior:"smooth"});};

function dims(a){
  if(a==="16:9") return [448,768];
  if(a==="1:1") return [512,512];
  return [768,448];
}
function extractUrl(x){
  if(!x) return null;
  if(typeof x==="string") return x;
  if(typeof x.url==="string") return x.url;
  if(typeof x.path==="string" && /^https?:/.test(x.path)) return x.path;
  if(x.video) return extractUrl(x.video);
  if(Array.isArray(x)){for(const y of x){const u=extractUrl(y);if(u)return u;}}
  if(typeof x==="object"){for(const y of Object.values(x)){const u=extractUrl(y);if(u)return u;}}
  return null;
}
function setError(msg){
  status.classList.add("show","err");
  status.innerHTML="<div>⚠️</div><div>"+msg+"</div>";
}
async function generate(){
  const prompt=promptEl.value.trim();
  if(!prompt){promptEl.focus();return;}
  result.classList.remove("show");
  gen.disabled=true;
  status.className="status show";
  status.innerHTML='<div class="spin"></div><div id="statusText">جاري الاتصال بمحرك الفيديو...</div>';
  try{
    const client=await Client.connect("Lightricks/ltx-video-distilled");
    document.querySelector("#statusText").textContent="تم الاتصال. جاري توليد المشهد الحقيقي — قد يستغرق بعض الوقت حسب طابور GPU...";
    const [h,w]=dims(aspect);
    const duration=Number($("#duration").value);
    const seed=Number($("#seed").value)||42;
    const negative="worst quality, blurry, jittery, distorted, deformed, text, subtitles, watermark, logo";
    const res=await client.predict("/text_to_video",[
      prompt,
      negative,
      null,
      null,
      h,
      w,
      "text-to-video",
      duration,
      9,
      seed,
      true,
      1.0,
      true
    ]);
    const url=extractUrl(res?.data?.[0] ?? res?.data ?? res);
    if(!url) throw new Error("اكتمل الطلب لكن لم يصل رابط الفيديو.");
    video.src=url;
    dl.href=url;
    result.classList.add("show");
    status.className="status show";
    status.innerHTML="<div>✅</div><div>تم إنشاء الفيديو الحقيقي.</div>";
    result.scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){
    console.error(e);
    const raw=String(e?.message||e||"");
    let msg="المحرك العام مشغول أو تعذر الوصول إليه الآن. اضغط إنشاء مرة أخرى.";
    if(/quota|rate|queue/i.test(raw)) msg="طابور الـGPU العام ممتلئ حاليًا. أعد المحاولة بعد قليل.";
    setError(msg);
  }finally{gen.disabled=false;}
}
gen.onclick=generate;

if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}
</script>
</body></html>
